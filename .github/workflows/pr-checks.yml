name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Syntax & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app tests

      - name: Run authorization tests
        run: python -m unittest tests/seguridad/test_autorizacion.py -v
        env:
          PYTHON_ENV: test
          SECRET_KEY: ci_django_secret_key
          JWT_SECRET: ci_secret_token_key_12345_con_32_bytes

      - name: Run clases_recurrentes tests
        run: python -m unittest tests/dominio/test_clases_recurrentes.py -v
        env:
          PYTHON_ENV: test
          SECRET_KEY: ci_django_secret_key
          JWT_SECRET: ci_secret_token_key_12345_con_32_bytes

      - name: Run horario domain tests
        run: python -m unittest tests/dominio/test_horario.py -v
        env:
          PYTHON_ENV: test
          SECRET_KEY: ci_django_secret_key
          JWT_SECRET: ci_secret_token_key_12345_con_32_bytes

      - name: Run excepciones tests
        run: python -m unittest tests/dominio/test_excepciones.py -v
        env:
          PYTHON_ENV: test
          SECRET_KEY: ci_django_secret_key
          JWT_SECRET: ci_secret_token_key_12345_con_32_bytes
