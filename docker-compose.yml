version: "3.8"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=development
      - PORT=8000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=tp_prog4
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=tp_prog4
      - NODE_API_URL=http://node:3000
      - JWT_SECRET=cambiar-en-produccion
    depends_on:
      - mongo

volumes:
  pgdata_python:
  mongodata:
